name: build-and-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build:
    name: build (${{ matrix.flavor }}/${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        flavor: [stable, dev]
        platform: [win, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve BizHawk build to compile against
        id: resolve
        env:
          FLAVOR: ${{ matrix.flavor }}
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess

          def get(url):
              return json.loads(subprocess.run(
                  ["curl", "-fsSL", "-H", f"Authorization: token {os.environ['GH_TOKEN']}", url],
                  capture_output=True, text=True).stdout)

          flavor = os.environ["FLAVOR"]
          platform = os.environ["PLATFORM"]
          if flavor == "stable":
              rel = get("https://api.github.com/repos/TASEmulators/BizHawk/releases/latest")
              tag = rel["tag_name"]
              commit = get(f"https://api.github.com/repos/TASEmulators/BizHawk/git/ref/tags/{tag}")["object"]["sha"]
              suffix = f"{platform}-x64"
              url = next(a["browser_download_url"] for a in rel["assets"] if suffix in a["name"])
              label = tag
          else:
              runs = get("https://api.github.com/repos/TASEmulators/BizHawk/actions/runs?branch=master&workflow_id=ci.yml&status=completed&conclusion=success&per_page=1")
              tag, commit = "dev", runs["workflow_runs"][0]["head_sha"]
              slug = "windows" if platform == "win" else "linux"
              url = f"https://nightly.link/TASEmulators/BizHawk/workflows/ci/master/BizHawk-dev-{slug}.zip"
              label = commit[:7]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"bizhawk_tag={tag}\n")
              f.write(f"bizhawk_commit={commit}\n")
              f.write(f"bizhawk_label={label}\n")
              f.write(f"bizhawk_url={url}\n")
          EOF

      - name: Download and extract BizHawk
        env:
          DL_URL: ${{ steps.resolve.outputs.bizhawk_url }}
        run: |
          mkdir -p bizhawk
          curl -fsSL -o bizhawk-dl "$DL_URL"
          python3 - <<'EOF'
          import os, shutil, zipfile, tarfile
          os.makedirs("bizhawk", exist_ok=True)
          if os.environ["DL_URL"].endswith(".zip"):
              with zipfile.ZipFile("bizhawk-dl") as z:
                  z.extractall("bizhawk")
          else:
              with tarfile.open("bizhawk-dl") as t:
                  t.extractall("bizhawk")
          if not os.path.exists("bizhawk/EmuHawk.exe"):
              subs = [d for d in os.listdir("bizhawk")
                      if os.path.isdir(os.path.join("bizhawk", d))]
              if len(subs) == 1:
                  inner = os.path.join("bizhawk", subs[0])
                  for name in os.listdir(inner):
                      shutil.move(os.path.join(inner, name), os.path.join("bizhawk", name))
                  os.rmdir(inner)
          EOF
          test -f bizhawk/dll/BizHawk.Client.Common.dll
          test -f bizhawk/EmuHawk.exe

      - name: Build tool
        run: |
          dotnet build src/BizHawkMcp/BizHawkMcp.csproj -c Release \
            -p:BizHawkInstallDir="$(pwd)/bizhawk"

      - name: Run unit tests
        run: dotnet test tests/BizHawkMcp.Tests/BizHawkMcp.Tests.csproj

      - name: Mono sanity (linux flavor only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-utils
          # Parse the net48 assembly with Mono's own tooling: monodis reads
          # the metadata and exits nonzero on malformed IL (light sanity for
          # the Linux target without installing the full Mono stack).
          monodis --assembly src/BizHawkMcp/bin/Release/BizHawkMcp.dll
          echo "Mono metadata parse passed (net48 assembly valid for the Linux target)"

      - name: Package
        run: |
          STAGE="staging"
          mkdir -p "$STAGE"
          cp src/BizHawkMcp/bin/Release/BizHawkMcp.dll "$STAGE/"
          cp src/BizHawkMcp/bin/Release/System.Text.Json.dll "$STAGE/"
          cp src/BizHawkMcp/bin/Release/System.Text.Encodings.Web.dll "$STAGE/" || true
          cp src/BizHawkMcp/bin/Release/System.Memory.dll "$STAGE/" || true
          cp src/BizHawkMcp/bin/Release/System.Buffers.dll "$STAGE/" || true
          cp src/BizHawkMcp/bin/Release/System.Numerics.Vectors.dll "$STAGE/" || true
          cp src/BizHawkMcp/bin/Release/System.Runtime.CompilerServices.Unsafe.dll "$STAGE/" || true
          cp src/BizHawkMcp/bin/Release/System.Threading.Tasks.Extensions.dll "$STAGE/" || true
          cp src/BizHawkMcp/bin/Release/Microsoft.Bcl.AsyncInterfaces.dll "$STAGE/" || true
          TOOL_VERSION="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}"
          cat > "$STAGE/build-info.json" <<EOF
          {
            "tool": {
              "name": "BizHawkMcp",
              "version": "${TOOL_VERSION}",
              "source_sha": "${{ github.sha }}"
            },
            "flavor": "${{ matrix.flavor }}",
            "platform": "${{ matrix.platform }}",
            "bizhawk": {
              "tag": "${{ steps.resolve.outputs.bizhawk_tag }}",
              "commit": "${{ steps.resolve.outputs.bizhawk_commit }}"
            },
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": {
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "repository": "${{ github.repository }}"
            }
          }
          EOF
          (cd "$STAGE" && zip -r "../BizHawkMcp-${{ matrix.flavor }}-${{ matrix.platform }}-${{ steps.resolve.outputs.bizhawk_label }}.zip" .)

      - uses: actions/upload-artifact@v5
        with:
          name: BizHawkMcp-${{ matrix.flavor }}-${{ matrix.platform }}
          path: BizHawkMcp-${{ matrix.flavor }}-${{ matrix.platform }}-*.zip

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Extract changelog section
        run: |
          TAG="${{ github.ref_name }}"
          python3 - "$TAG" <<'EOF'
          import sys
          tag = sys.argv[1]
          out, in_section = [], False
          with open("CHANGELOG.md") as f:
              for ln in f:
                  if ln.startswith("## ["):
                      if in_section:
                          break
                      in_section = ln.startswith(f"## [{tag}]")
                      continue
                  if in_section:
                      out.append(ln.rstrip("\n"))
          with open("notes.md", "w") as f:
              f.write("\n".join(out).strip() + ("\n" if out else ""))
          EOF

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -s notes.md ]; then
            ARGS=(--notes-file notes.md)
          else
            ARGS=(--generate-notes)
          fi
          gh release create "$TAG" artifacts/**/*.zip "${ARGS[@]}" || true
          gh release upload "$TAG" artifacts/**/*.zip --clobber
